id: authentication-expired
version: 1
title: Expired or invalid CI credential
categories:
  - authentication_failure
required_evidence:
  - HTTP 401 response or explicit credential-expiration signal
safe_actions:
  - Verify credential expiry and protected-variable availability.
  - Rotate the credential through the approved secret-management path.
prohibited_actions:
  - Display a credential value.
  - Change credentials automatically.
investigate:
  - Use search_log for 401, 403 or expired to find which command and host rejected the credential.
  - Use get_ci_config to see which variable name the failing command reads; never try to read its value.
  - Check list_changed_files for changes to the job's variables or protected-branch settings.
