id: deployment-api-failure
version: 1
title: External deployment API failure
categories:
  - deployment_failure
  - external_api_failure
  - timeout
required_evidence:
  - A deployment command plus an HTTP failure or timeout signal
safe_actions:
  - Verify target service health and idempotency before retrying.
  - Check bounded retry behavior and the exact deployment request context.
prohibited_actions:
  - Retry indefinitely.
  - Trigger a production deployment automatically.
investigate:
  - Use get_log_window around the first HTTP error or timeout to see the request that failed.
  - Use get_ci_config to read the deploy script, its retry settings and the target environment.
  - Check list_jobs for earlier deploy jobs in the same pipeline that succeeded against the same target.
