id: test-failure
version: 1
title: Failing automated test
categories:
  - test_failure
required_evidence:
  - A named failing test, assertion, or test runner exit failure
safe_actions:
  - Reproduce the cited test command with the same dependency versions.
  - Inspect the assertion and affected fixture or service dependency.
prohibited_actions:
  - Disable the test to unblock deployment.
  - Raise a timeout without measuring the operation.
investigate:
  - Use search_log for FAILED, AssertionError or Error to find the first failing test name.
  - Use list_repository_files to locate the test file, then read_source around the failing test.
  - Read fixtures or conftest/setup files the failing test depends on.
  - Use list_changed_files to see whether the tested module changed in this commit.
