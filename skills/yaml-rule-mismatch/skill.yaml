id: yaml-rule-mismatch
version: 1
title: CI rule or condition mismatch
categories:
  - yaml_rule_mismatch
required_evidence:
  - A skipped job and a rule or condition that did not match the run context
safe_actions:
  - Compare branch, event, and variable context against the rule.
  - Verify dependencies were not skipped by the same condition.
prohibited_actions:
  - Remove protected deployment conditions without review.
  - Make all jobs unconditional.
investigate:
  - Use get_ci_config to read the rules:/only:/except: block of the skipped job.
  - Compare it with the pipeline ref, source and variables shown by list_jobs and the finding.
  - Check list_changed_files for edits to .gitlab-ci.yml or included CI files.
