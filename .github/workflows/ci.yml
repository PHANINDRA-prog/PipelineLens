name: PipelineLens CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[cloud,worker,dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest -q
