services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pipelinelens
      POSTGRES_USER: pipelinelens
      POSTGRES_PASSWORD: pipelinelens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelinelens -d pipelinelens"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - pipelinelens-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn pipelinelens.api.main:app --host 0.0.0.0 --port 8000
    environment:
      PIPELINELENS_ENV: development
      PIPELINELENS_DATABASE_URL: postgresql+psycopg://pipelinelens:pipelinelens@postgres:5432/pipelinelens
      PIPELINELENS_REDIS_URL: redis://redis:6379/0
      PIPELINELENS_LLM_MODE: ${PIPELINELENS_LLM_MODE:-disabled}
      PIPELINELENS_LLM_BASE_URL: ${PIPELINELENS_LLM_BASE_URL:-https://api.openai.com/v1}
      PIPELINELENS_LLM_MODEL: ${PIPELINELENS_LLM_MODEL:-gpt-4.1-mini}
      PIPELINELENS_LLM_API_KEY: ${PIPELINELENS_LLM_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: .
    command: dramatiq pipelinelens.workers.tasks --processes 1 --threads 4
    environment:
      PIPELINELENS_ENV: development
      PIPELINELENS_DATABASE_URL: postgresql+psycopg://pipelinelens:pipelinelens@postgres:5432/pipelinelens
      PIPELINELENS_REDIS_URL: redis://redis:6379/0
      PIPELINELENS_LLM_MODE: ${PIPELINELENS_LLM_MODE:-disabled}
      PIPELINELENS_LLM_BASE_URL: ${PIPELINELENS_LLM_BASE_URL:-https://api.openai.com/v1}
      PIPELINELENS_LLM_MODEL: ${PIPELINELENS_LLM_MODEL:-gpt-4.1-mini}
      PIPELINELENS_LLM_API_KEY: ${PIPELINELENS_LLM_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build: .
    command: streamlit run src/pipelinelens/dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      PIPELINELENS_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_started
    ports:
      - "8501:8501"

volumes:
  pipelinelens-postgres:
